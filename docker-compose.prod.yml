version: '3.9'

services:

  db:
    image: postgres:13
    restart: always
    volumes:
      - ./data/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - internal_network

  django:
    build: ./lycaste
    restart: always
    volumes:
      - ./data/img:/app/main/static/img
      - ./data/migrations/main:/app/main/migrations
      - ./data/migrations/authentication:/app/authentication/migrations
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db
    networks:
      - internal_network

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./data/certbot/www/:/var/www/certbot/:rw
      - ./data/certbot/conf/:/etc/letsencrypt/:rw

  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:14.0.0
    restart: always
    hostname: mail.lycaste.eu
    ports:
      - "25:25"     # SMTP
      - "465:465"   # SMTPS (SSL)
      - "587:587"   # Submission (STARTTLS)
      - "993:993"   # IMAPS (SSL)
    volumes:
      - ./data/mailserver/mail-data/:/var/mail/
      - ./data/mailserver/mail-state/:/var/mail-state/
      - ./data/mailserver/mail-logs/:/var/log/mail/
      - ./data/mailserver/config/:/tmp/docker-mailserver/
      - /etc/letsencrypt/:/etc/letsencrypt:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=0
      - ENABLE_AMAVIS=0
      - SSL_TYPE=letsencrypt # Tell docker-mailserver to use Let's Encrypt certificates
    cap_add:
      - NET_ADMIN

  webserver:
    image: nginx:latest
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./data/certbot/www:/var/www/certbot/:ro
      - ./data/certbot/conf/:/etc/nginx/ssl/:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - django
      - wordpress
    networks:
      - internal_network
      
networks:
  internal_network:
      driver: bridge