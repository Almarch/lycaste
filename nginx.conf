
worker_processes 1;

events {
    worker_connections 1024;  # Maximum number of simultaneous connections
}

http {
    server {
        listen 80;
        server_name lycaste.eu www.lycaste.eu mail.lycaste.eu;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }

    server {
        listen 443 ssl;
        server_name mail.lycaste.eu;

        ssl_certificate /etc/nginx/ssl/lycaste.eu.crt;
        ssl_certificate_key /etc/nginx/ssl/lycaste.eu.key;
    }

    server {
        listen 443 ssl;
        server_name lycaste.eu www.lycaste.eu;

        ssl_certificate /etc/nginx/ssl/lycaste.eu.crt;
        ssl_certificate_key /etc/nginx/ssl/lycaste.eu.key;

        location / {
            proxy_pass http://django:80/;
            proxy_redirect http://django:80/ $scheme://$http_host/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 20d;
            proxy_buffering off;
        }
    }
}

